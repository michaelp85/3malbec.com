name: Update PocketSmith Account balance

on:
  schedule:
    # Run at 4:42pm daily
    - cron: "42 16 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-balance
  cancel-in-progress: false

jobs:
  update-balance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check requests==2.32.3

      - name: Fetch balance from PocketSmith
        id: fetch
        env:
          POCKETSMITH_KEY: ${{ secrets.POCKETSMITH_KEY }}
          POCKETSMITH_ACCOUNT_ID: ${{ secrets.POCKETSMITH_ACCOUNT_ID }}
        run: python scripts/pocketsmith_update_balance.py

      # Commit only if the balance actually changed - keeps history and any
      # downstream Hugo deploy triggers limited to real updates.
      - name: Commit and push if changed
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pocketsmith_balance_history.json
          git commit -m "Update PocketSmith Account balance"
          git push
